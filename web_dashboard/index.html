<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FasalMitra Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>FasalMitra Admin</h1>
    <div class="session">
      <span id="who"></span>
      <button id="signout-btn" hidden>Sign out</button>
    </div>
  </header>

  <main>
    <section id="auth-panel">
      <h2>Sign in</h2>
      <form id="signin-form">
        <label>Email <input type="email" name="email" required /></label>
        <label>Password <input type="password" name="password" required minlength="8" /></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="auth-message" class="error"></p>
      <p class="hint">Staff accounts only. Farmers and buyers use the mobile app.</p>
    </section>

    <section id="dashboard" hidden>
      <nav id="tabs"></nav>
      <div class="toolbar">
        <h2 id="view-title"></h2>
        <button id="add-btn" hidden>Add new</button>
      </div>
      <p id="status" class="hint"></p>
      <div class="table-wrap">
        <table id="data-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="editor">
    <form id="editor-form">
      <h3 id="editor-title"></h3>
      <div id="editor-fields"></div>
      <p id="editor-error" class="error"></p>
      <div class="actions">
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
