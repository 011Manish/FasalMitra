name: agrismart_ai
description: Farmer-facing mobile app for FASALMITRA.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  fl_chart: ^0.69.0
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/app.env